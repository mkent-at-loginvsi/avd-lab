---
# Semaphore entrypoint for the Login Enterprise appliance: terraform apply (copies the VHD into
# the lab's storage account, builds a Gen 1 managed image, creates the VM with cloud-init), then
# waits for the web UI. Replaces Lab Manager's apply -> inventory -> site.yml flow.
- name: Deploy the Login Enterprise appliance
  hosts: localhost
  connection: local
  gather_facts: false
  # Semaphore passes the environment's variables as extra vars; Terraform's azurerm provider
  # reads them from the process environment.
  environment:
    ARM_CLIENT_ID: "{{ ARM_CLIENT_ID }}"
    ARM_CLIENT_SECRET: "{{ ARM_CLIENT_SECRET }}"
    ARM_SUBSCRIPTION_ID: "{{ ARM_SUBSCRIPTION_ID }}"
    ARM_TENANT_ID: "{{ ARM_TENANT_ID }}"
  vars:
    tf_dir: "{{ playbook_dir }}/../terraform"
    tf_state: "{{ tf_state_dir | default('/var/lib/semaphore/tfstate') }}/{{ lab_name | default('le-appliance') }}.tfstate"
    tf_tags:
      purpose: "{{ purpose | default('loginenterprise-appliance') }}"
      managed_by: semaphore
  tasks:
    - name: Ensure the state directory exists
      ansible.builtin.file:
        path: "{{ tf_state | dirname }}"
        state: directory
        mode: "0700"

    - name: Write Terraform variables file
      ansible.builtin.copy:
        dest: "{{ tf_dir }}/lab.auto.tfvars.json"
        mode: "0600"
        content: "{{ tf_vars | to_nice_json }}"
      no_log: true
      vars:
        tf_vars:
          location: "{{ location | default('eastus') }}"
          vhd_source_url: "{{ vhd_source_url }}"
          appliance_admin_password: "{{ appliance_admin_password }}"
          dns_hostname: "{{ dns_hostname | default('leappliance') }}"
          appliance_domain_name: "{{ appliance_domain_name | default('') }}"
          vm_admin_username: "{{ vm_admin_username | default('azureadministrator') }}"
          vm_admin_password: "{{ vm_admin_password }}"
          admin_source_cidr: "{{ admin_source_cidr }}"
          vm_size: "{{ vm_size | default('Standard_D4s_v4') }}"
          deploy_launcher: "{{ (deploy_launcher | default('false') | string | lower) in ['true', '1', 'yes'] }}"
          launcher_vm_size: "{{ launcher_vm_size | default('Standard_B2s') }}"
          labmgr_tags: "{{ tf_tags }}"

    - name: terraform init
      ansible.builtin.command:
        cmd: terraform init -input=false -no-color
        chdir: "{{ tf_dir }}"
      changed_when: false

    # The VHD is tens of GB; Azure copies it server-side, so this step can take a long while.
    - name: terraform apply
      ansible.builtin.command:
        cmd: terraform apply -auto-approve -input=false -no-color -state={{ tf_state }}
        chdir: "{{ tf_dir }}"

    - name: Read the appliance address
      ansible.builtin.command:
        cmd: terraform output -raw -state={{ tf_state }} appliance_public_ip
        chdir: "{{ tf_dir }}"
      register: appliance_ip
      changed_when: false

    - name: Read the appliance DNS name
      ansible.builtin.command:
        cmd: terraform output -raw -state={{ tf_state }} appliance_fqdn
        chdir: "{{ tf_dir }}"
      register: appliance_fqdn
      changed_when: false

    - name: Wait for the appliance web UI (first run takes several minutes)
      ansible.builtin.wait_for:
        host: "{{ appliance_ip.stdout }}"
        port: 443
        delay: 30
        timeout: 1200
      register: ui_wait
      # The lab is deployed either way; only the reachability check is best-effort, because the
      # machine running Semaphore may not be inside admin_source_cidr.
      ignore_errors: true

    - name: Show where the appliance is
      ansible.builtin.debug:
        msg: >-
          Appliance https://{{ appliance_fqdn.stdout }} ({{ appliance_ip.stdout }})
          ({{ 'web UI is answering' if not ui_wait.failed else 'web UI not reachable from Semaphore yet - check from your workstation' }}).
          SSH as admin with the appliance password.
