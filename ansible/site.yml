# Two modes, picked by deploy_domain_controller:
#   false - session hosts are Entra-joined by Terraform (AADLoginForWindows); only the AVD agent
#           is installed here, and the domain_controllers group is empty.
#   true  - a DC is promoted, the session hosts join its domain, and Cloud Sync pushes the AD test
#           users to Entra so they can sign in to AVD (Entra first, then the Windows prompt).
- name: Promote the domain controller
  hosts: domain_controllers
  gather_facts: false
  tasks:
    - name: Install AD-DS and DNS Windows features
      ansible.windows.win_feature:
        name:
          - AD-Domain-Services
          - DNS
        include_management_tools: true
        state: present

    - name: Create the new forest and domain
      microsoft.ad.domain:
        dns_domain_name: "{{ domain_name }}"
        safe_mode_password: "{{ ansible_password }}"
        reboot: true

- name: Create AD test accounts for load testing
  hosts: domain_controllers
  gather_facts: false
  tasks:
    # Users must carry the Entra tenant's domain as their UPN suffix so the synced Entra identity
    # signs in with the same name (e.g. testuser01@<tenant>.onmicrosoft.com).
    - name: Add the Entra tenant domain as a UPN suffix of the forest
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false
          $suffix = '{{ entra_domain }}'
          if ((Get-ADForest).UPNSuffixes -notcontains $suffix) {
            Set-ADForest -Identity (Get-ADForest) -UPNSuffixes @{Add = $suffix}
            $Ansible.Changed = $true
          }

    - name: Create the SessionDesktop AD group
      microsoft.ad.group:
        name: SessionDesktop
        scope: global
        category: security
        state: present

    - name: Create test user accounts
      microsoft.ad.user:
        name: "testuser{{ '%02d' | format(item) }}"
        upn: "testuser{{ '%02d' | format(item) }}@{{ entra_domain }}"
        password: "{{ test_user_password }}"
        # Without this the module resets the password on every run and always reports changed.
        update_password: on_create
        password_never_expires: true
        enabled: true
        state: present
        groups:
          add:
            - SessionDesktop
      loop: "{{ range(1, test_user_count | int + 1) | list }}"
      no_log: true

- name: Join the session hosts to the domain
  hosts: session_hosts
  gather_facts: false
  tasks:
    - name: Point DNS at the domain controller
      ansible.windows.win_dns_client:
        adapter_names: "*"
        dns_servers:
          - "{{ dc_private_ip }}"
      when: groups['domain_controllers'] | length > 0

    - name: Join the domain
      microsoft.ad.membership:
        dns_domain_name: "{{ domain_name }}"
        domain_admin_user: "{{ ansible_user }}@{{ domain_name }}"
        domain_admin_password: "{{ ansible_password }}"
        state: domain
        reboot: true
      when: groups['domain_controllers'] | length > 0

- name: Install and register the AVD agent on session hosts
  hosts: session_hosts
  gather_facts: false
  vars:
    # Microsoft's durable direct-download links for the AVD agent installers,
    # documented at https://learn.microsoft.com/azure/virtual-desktop/session-host-configuration
    avd_bootloader_url: "https://query.prod.cms.rt.microsoft.com/cms/api/am/binary/RWrxrH"
    avd_agent_url: "https://query.prod.cms.rt.microsoft.com/cms/api/am/binary/RWrmXv"
  tasks:
    - name: Download the AVD Boot Loader installer
      ansible.windows.win_get_url:
        url: "{{ avd_bootloader_url }}"
        dest: "C:\\Windows\\Temp\\AVDBootLoader.msi"

    - name: Install the AVD Boot Loader
      ansible.windows.win_package:
        path: "C:\\Windows\\Temp\\AVDBootLoader.msi"
        arguments: "/quiet /norestart"
        state: present

    - name: Download the AVD Agent installer
      ansible.windows.win_get_url:
        url: "{{ avd_agent_url }}"
        dest: "C:\\Windows\\Temp\\AVDAgent.msi"

    - name: Install and register the AVD Agent with the host pool
      ansible.windows.win_package:
        path: "C:\\Windows\\Temp\\AVDAgent.msi"
        arguments: "/quiet /norestart REGISTRATIONTOKEN={{ avd_registration_token }}"
        state: present

# The published program is installed by hand on the first session host. A RemoteApp host needs the
# same files, so copy them over (a few hundred KB) through the controller.
- name: Fetch the Logon app from the first desktop session host
  hosts: session_hosts:!app_hosts
  gather_facts: false
  run_once: true
  vars:
    logon_dir: "C:\\Logon"
    logon_cache: "/tmp/avd-logon-cache"
  tasks:
    - name: Find the app files
      ansible.windows.win_find:
        paths: "{{ logon_dir }}"
        file_type: file
      register: logon_files
      when: (groups['app_hosts'] | default([]) | length > 0) or (logon_script_enabled | default(false) | bool)

    - name: Fetch them to the controller
      ansible.builtin.fetch:
        src: "{{ item.path }}"
        dest: "{{ logon_cache }}/"
        flat: true
      loop: "{{ logon_files.files | default([]) }}"
      loop_control:
        label: "{{ item.filename }}"
      when: (groups['app_hosts'] | default([]) | length > 0) or (logon_script_enabled | default(false) | bool)

- name: Copy the Logon app to the RemoteApp hosts
  hosts: app_hosts
  gather_facts: false
  vars:
    logon_dir: "C:\\Logon"
    logon_cache: "/tmp/avd-logon-cache"
  tasks:
    - name: Create the app folder
      ansible.windows.win_file:
        path: "{{ logon_dir }}"
        state: directory

    - name: Copy the app files
      ansible.windows.win_copy:
        src: "{{ item }}"
        dest: "{{ logon_dir }}\\"
      loop: "{{ lookup('ansible.builtin.fileglob', logon_cache + '/*', wantlist=True) }}"

# Optional: run the Logon app as a domain logon script (AD user Profile tab -> Logon script), per
# https://docs.loginvsi.com/login-enterprise/6.9/configuring-logon-processor-as-a-logon-script
# The exe must live in NETLOGON; scriptPath is read from AD by the session host at sign-in, so it
# needs no Entra sync. Needs logon_script_enabled=true and logon_script_url (the appliance URL).
- name: Publish the Logon app as a domain logon script
  hosts: domain_controllers
  gather_facts: false
  vars:
    logon_cache: "/tmp/avd-logon-cache"
    netlogon_dir: "C:\\Windows\\SYSVOL\\sysvol\\{{ domain_name }}\\scripts"
    # Relative to NETLOGON, as in the Login VSI docs screenshot (not a UNC path).
    logon_script_path: "LoginPI.Logon.exe {{ logon_script_url | default('') }}"
  tasks:
    - name: Run only when the logon script is enabled
      ansible.builtin.meta: end_host
      when: not (logon_script_enabled | default(false) | bool)

    - name: Require the appliance URL
      ansible.builtin.assert:
        that: logon_script_url | default('') | trim != ''
        fail_msg: logon_script_url (the Login Enterprise appliance URL) is required when logon_script_enabled is true

    - name: Copy the Logon app into NETLOGON
      ansible.windows.win_copy:
        src: "{{ item }}"
        dest: "{{ netlogon_dir }}\\"
      loop: "{{ lookup('ansible.builtin.fileglob', logon_cache + '/*', wantlist=True) }}"

    - name: Set the logon script on each test user
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false
          $want = '{{ logon_script_path }}'
          foreach ($n in 1..{{ test_user_count | int }}) {
            $u = Get-ADUser -Identity ('testuser{0:D2}' -f $n) -Properties ScriptPath
            if ($u.ScriptPath -ne $want) {
              Set-ADUser -Identity $u -ScriptPath $want
              $Ansible.Changed = $true
            }
          }

- name: Sync the AD users to Entra ID with Cloud Sync
  ansible.builtin.import_playbook: cloudsync.yml
